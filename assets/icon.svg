<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#fbfbfd"/>
      <stop offset="0.55" stop-color="#ececf0"/>
      <stop offset="1" stop-color="#d5d5db"/>
    </linearGradient>
    <linearGradient id="graphite" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#414146"/>
      <stop offset="0.5" stop-color="#262629"/>
      <stop offset="1" stop-color="#171719"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
    <filter id="baseShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="188" fill="url(#base)" filter="url(#baseShadow)"/>
  <rect x="101" y="101" width="822" height="822" rx="187" fill="none" stroke="#000000" stroke-opacity="0.10"/>
  <rect x="115" y="115" width="794" height="794" rx="174" fill="none" stroke="#ffffff" stroke-opacity="0.75"/>

  <rect x="242" y="236" width="540" height="540" rx="132" fill="url(#graphite)" filter="url(#cardShadow)"/>
  <rect x="243" y="237" width="538" height="538" rx="131" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>

  <text x="512" y="622" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="316" font-weight="700" letter-spacing="-14" fill="#ffffff">N</text>
  <rect x="392" y="664" width="240" height="18" rx="9" fill="#ffffff" opacity="0.34"/>
</svg>
